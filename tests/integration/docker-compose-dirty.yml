# File: tests/integration/docker-compose-dirty.yml
#
# Third container used by the --drop-schema integration scenario.
# Seeded with destination-dirty.sql — a deliberately wrong schema
# (missing columns, extra columns, extra tables) that PostgresCopy
# must drop and rebuild from origin DDL before data can be copied.

services:
  destination-dirty:
    image: postgres:17-alpine
    container_name: pgcopy-destination-dirty
    environment:
      POSTGRES_DB: pgcopy
      POSTGRES_PASSWORD: test
    ports:
      - "55434:5432"
    volumes:
      - ./destination-dirty.sql:/docker-entrypoint-initdb.d/001-destination-dirty.sql:ro
